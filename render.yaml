# Render Blueprint: one web service runs the API and serves the frontend.
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: gym-duel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true   # random secret created by Render
      - key: DATABASE_URL
        sync: false           # paste the PostgreSQL URL in the dashboard (see README)
      - key: MAX_USERS
        value: "2"
      - key: MAX_WORKOUTS_PER_DAY
        value: "1"
